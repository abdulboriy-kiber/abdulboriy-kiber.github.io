<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abdulboriy Kiber</title>
<meta name="description" content="Abdulboriy Kiber: xotira, topishmoq va inglizcha so'z topish o'yinlari.">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f7fb;--card:#fff;--tx:#1d2733;--ac:#3b82f6;--ok:#16a34a;--no:#dc2626;--bd:#d6dee8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--card:#1b242e;--tx:#e8eef5;--bd:#2f3c4a}}
:root[data-theme="dark"]{--bg:#10161d;--card:#1b242e;--tx:#e8eef5;--bd:#2f3c4a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:14px}
main{max-width:820px;margin:0 auto}
h1{font-size:1.5rem;text-align:center;margin:8px 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:11px 4px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-size:.95rem;cursor:pointer}
.tabs button.on{border-color:var(--ac);background:var(--ac);color:#fff}
.arena{display:grid;grid-template-columns:1fr minmax(0,2.6fr) 1fr;gap:12px;align-items:start}
.mid{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
.team{border-radius:16px;padding:14px 8px;text-align:center;color:#fff;font-weight:700;border:4px solid transparent}
.team.b{background:#2563eb}.team.r{background:#dc2626}
.team .n{font-size:2.4rem;line-height:1.2}
.team .t{min-height:1.3em;font-size:.9rem}
.team.turn{border-color:#facc15;box-shadow:0 0 0 3px rgba(250,204,21,.4)}
@media(max-width:600px){.arena{grid-template-columns:1fr 1fr}.mid{grid-column:1/-1;order:-1}}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.c{aspect-ratio:1;border:0;border-radius:12px;font-size:clamp(1.4rem,6vw,2.2rem);background:var(--ac);color:#fff;cursor:pointer}
.c.open{background:var(--card);border:2px solid var(--ac)}
.c.done{background:var(--ok);color:#fff}
.info{text-align:center;font-weight:600}
.btn{padding:10px 18px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:1rem;cursor:pointer}
.q{font-size:1.15rem;margin:8px 0 14px;line-height:1.5}
.opt{display:block;width:100%;margin:8px 0;padding:12px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font-size:1rem;text-align:left;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--no);color:#fff}
.msg{text-align:center;font-weight:700;margin:10px 0;min-height:1.4em}
.hide{display:none}
.ws{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:10px 0;user-select:none;-webkit-user-select:none}
.w{aspect-ratio:1;padding:0;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);font-weight:700;font-size:clamp(.75rem,3.6vw,1.1rem);cursor:pointer}
.w.sel{background:#facc15;color:#000}
.w.fb,.chip.fb{background:#2563eb;color:#fff}
.w.fr,.chip.fr{background:#dc2626;color:#fff}
.chips{text-align:center}
.chip{display:inline-block;margin:3px;padding:4px 10px;border-radius:999px;border:1px solid var(--bd);font-weight:700;letter-spacing:.5px}
.chip.fb,.chip.fr{text-decoration:line-through}
.timer{text-align:center;font-size:1.6rem;font-weight:800;margin:6px 0}
.timer.low{color:#dc2626}
.tsel{display:flex;gap:8px;justify-content:center;margin:8px 0}
.tsel button{padding:8px 14px;border:2px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-weight:700;cursor:pointer}
.tsel button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.w.fx,.chip.fx{background:#6b7280;color:#fff}
.w.fg,.chip.fg{background:#16a34a;color:#fff}
.chip.fg{text-decoration:line-through}
.w.bad{background:#dc2626;color:#fff}
.tsel button:disabled{opacity:.45;cursor:not-allowed}
.tsel button.on:disabled{opacity:1}
.arena.solo{grid-template-columns:1fr minmax(0,3fr)}
@media(max-width:600px){.arena.solo{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>🎓 Abdulboriy Kiber</h1>
<div id="modeSel" class="mid" style="text-align:center;margin-bottom:14px"><div class="q">Nechta kishi o'ynaydi?</div><button class="btn" style="margin:4px" onclick="setMode(1)">👤 1 kishilik</button><button class="btn" style="margin:4px" onclick="setMode(2)">👥 2 kishilik (jamoalar)</button></div>
<div id="gameWrap" class="hide">
<div class="tabs">
<button id="t1" class="on" onclick="show(1)">🧠 Xotira</button>
<button id="t2" onclick="show(2)">❓ Topishmoq</button>
<button id="t3" onclick="show(3)">🔤 English</button>
</div>

<section id="g1" class="arena">
<div class="team b" id="tb1"></div>
<div class="mid">
<div class="info">Yurishlar: <b id="mv">0</b> &nbsp;|&nbsp; Juftlar: <b id="pr">0</b>/8</div>
<div class="grid" id="board"></div>
<div class="msg" id="m1"></div>
<div style="text-align:center"><button class="btn" onclick="initMem()">Yangi o'yin (yangi rasmlar)</button></div>
</div>
<div class="team r" id="tr1"></div>
</section>

<section id="g2" class="arena hide">
<div class="team b" id="tb2"></div>
<div class="mid">
<div class="info" id="qn"></div>
<div class="q" id="qt"></div>
<div id="opts"></div>
<div class="msg" id="m2"></div>
<div style="text-align:center"><button class="btn" id="nx" onclick="nextQ()">Keyingisi</button></div>
</div>
<div class="team r" id="tr2"></div>
</section>

<section id="g3" class="arena hide">
<div class="team b" id="tb3"></div>
<div class="mid">
<div class="info">Vaqtni tanlang va so'zlarni toping</div>
<div class="tsel"><button id="ts15" onclick="setT(15)">⏱ 15 soniya</button><button id="ts30" class="on" onclick="setT(30)">⏱ 30 soniya</button></div>
<div class="timer" id="tm"></div>
<div id="wsready" style="text-align:center;margin:14px 0"><div class="msg" id="rdy" style="min-height:0">Raqib bilan tayyorlaning! Ko'k jamoa birinchi bo'lib boshlaydi.</div><button class="btn" style="background:#2563eb;font-size:1.2rem;padding:14px 28px" id="rdyb" onclick="startWS()">▶ Boshlash (Ko'k jamoa)</button></div>
<div id="wsplay" class="hide"><div class="chips" id="chips"></div><div class="ws" id="ws"></div></div>
<div class="msg" id="m3"></div>
<div style="text-align:center"><button class="btn" onclick="initWS()">Yangi o'yin (yangi so'zlar)</button> <button class="btn hide" id="endb" style="background:#6b7280" onclick="endWS()">🏁 Tugatish</button></div>
</div>
<div class="team r" id="tr3"></div>
</section>
<div style="text-align:center;margin-top:12px"><button class="btn" style="background:#6b7280" onclick="chooseMode()">🔄 O'yinchilar sonini o'zgartirish</button></div>
</div>
</main>

<script>
var players=0;
function g(i){return document.getElementById(i)}
function setMode(n){
  players=n;
  g('modeSel').classList.add('hide');g('gameWrap').classList.remove('hide');
  for(var i=1;i<=3;i++){mkTeams(i);g('g'+i).classList.toggle('solo',n===1);g('tr'+i).classList.toggle('hide',n===1)}
  g('rdy').textContent=n===1?"Tayyor bo'lsangiz, boshlang!":"Raqib bilan tayyorlaning! Ko'k jamoa birinchi bo'lib boshlaydi.";
  g('rdyb').textContent=n===1?"▶ Boshlash":"▶ Boshlash (Ko'k jamoa)";
  initMem();initQ();initWS();show(1);
}
function chooseMode(){stopTimer();g('modeSel').classList.remove('hide');g('gameWrap').classList.add('hide')}
var cur=1;
function show(n){
  cur=n;
  for(var i=1;i<=3;i++){g('g'+i).classList.toggle('hide',i!==n);g('t'+i).classList.toggle('on',i===n)}
  if(n===3)resumeTimer();else stopTimer();
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function mkTeams(n){
  g('tb'+n).innerHTML=(players===1?"Sizning ball":"Ko'k jamoa")+"<div class='n' id='sb"+n+"'>0</div><div class='t' id='tbn"+n+"'></div>";
  g('tr'+n).innerHTML="Qizil jamoa<div class='n' id='sr"+n+"'>0</div><div class='t' id='trn"+n+"'></div>";
}
function teams(n,sc,t){
  if(players===1)t=-1;
  g('sb'+n).textContent=sc[0];g('sr'+n).textContent=sc[1];
  g('tb'+n).classList.toggle('turn',t===0);g('tr'+n).classList.toggle('turn',t===1);
  g('tbn'+n).textContent=t===0?'▶ Navbat':'';g('trn'+n).textContent=t===1?'▶ Navbat':'';
}
function winTxt(a){if(players===1)return "🏆 Natijangiz: "+a[0]+" ball";return a[0]>a[1]?"🏆 Ko'k jamoa yutdi!":(a[1]>a[0]?"🏆 Qizil jamoa yutdi!":"🤝 Durang!")}
mkTeams(1);mkTeams(2);mkTeams(3);

/* ---------- XOTIRA ---------- */
var EMALL=['🍎','🐱','🚀','🌳','⚽','📚','🐟','🌞','🐶','🚗','🎈','🍌','🦋','🏠','⭐','🍉','🐢','🎵','🍕','🌈'];
var EM=[],first=null,lock=false,moves=0,pairs=0,team=0,ms=[0,0];
function initMem(){
  var b=g('board');b.innerHTML='';
  first=null;lock=false;moves=0;pairs=0;team=0;ms=[0,0];teams(1,ms,0);
  g('mv').textContent=0;g('pr').textContent=0;g('m1').textContent='';
  EM=shuffle(EMALL.slice()).slice(0,8);
  shuffle(EM.concat(EM)).forEach(function(e){
    var c=document.createElement('button');
    c.className='c';c.textContent='?';c.dataset.e=e;
    c.onclick=function(){flip(c)};
    b.appendChild(c);
  });
}
function flip(c){
  if(lock||c.classList.contains('open')||c.classList.contains('done'))return;
  c.classList.add('open');c.textContent=c.dataset.e;
  if(!first){first=c;return}
  moves++;g('mv').textContent=moves;
  if(first.dataset.e===c.dataset.e){
    first.classList.add('done');c.classList.add('done');
    first=null;pairs++;ms[team]++;g('pr').textContent=pairs;
    if(pairs===8){teams(1,ms,-1);g('m1').textContent=winTxt(ms)}
    else teams(1,ms,team);
  }else{
    lock=true;var a=first;first=null;
    setTimeout(function(){
      a.classList.remove('open');a.textContent='?';
      c.classList.remove('open');c.textContent='?';lock=false;team=players===2?1-team:0;teams(1,ms,team);
    },800);
  }
}

/* ---------- TOPISHMOQ ---------- */
var Q=[
 {q:'Qadimgi Misrda fir\'avnlar qabri sifatida qurilgan, eng mashhuri Xufu (Xeops) nomi bilan bog\'liq ulkan tosh inshoot nima?',o:['Piramida','Kolizey','Akropol','Minora'],a:0},
 {q:'Dajla va Furot daryolari oralig\'ida paydo bo\'lgan, dunyoning eng qadimgi sivilizatsiyalaridan biri qanday ataladi?',o:['Mesopotamiya','Qadimgi Misr','Hind vodiysi','Qadimgi Xitoy'],a:0},
 {q:'Qadimgi Yunonistonda "demokratiya" (xalq hokimiyati) tug\'ilgan shahar-davlat qaysi?',o:['Afina','Sparta','Rim','Troya'],a:0},
 {q:'Milodiy 476-yilda qaysi imperiyaning g\'arbiy qismi quladi va qadimgi davr tugadi?',o:['Rim imperiyasi','Fors imperiyasi','Mo\'g\'ul imperiyasi','Usmonlilar imperiyasi'],a:0},
 {q:'Buyuk Ipak yo\'li Sharqdagi Xitoyni qaysi hudud bilan bog\'lagan?',o:['O\'rta Yer dengizi va Yevropa','Amerika','Avstraliya','Antarktida'],a:0},
 {q:'1492-yilda Xristofor Kolumb o\'zi Hindistonga deb o\'ylab, aslida qaysi qit\'a qirg\'oqlariga yetib bordi?',o:['Amerika','Afrika','Avstraliya','Antarktida'],a:0},
 {q:'Yevropada Uyg\'onish (Renessans) davri qaysi mamlakatda boshlangan?',o:['Italiya','Rossiya','Shvetsiya','Turkiya'],a:0},
 {q:'Buyuk Fransuz inqilobi qaysi yilda boshlangan?',o:['1789','1812','1917','1648'],a:0},
 {q:'Butun dunyoni qamrab olgan Birinchi jahon urushi qaysi yillarda bo\'lgan?',o:['1914–1918','1939–1945','1900–1905','1950–1953'],a:0},
 {q:'Ikkinchi jahon urushi qaysi yilda tugadi?',o:['1945','1918','1939','1953'],a:0},
 {q:'15-asrda nemis ixtirochisi Gutenberg nimani ixtiro qilib, kitob chop etishda inqilob qildi?',o:['Bosma dastgoh','Parovoz','Kompas','Porox'],a:0},
 {q:'18–19-asrlarda parovoz va fabrikalar paydo bo\'lib, mehnat mashina bilan bajarila boshlagan davr nima deb ataladi?',o:['Sanoat inqilobi','Uyg\'onish davri','Islohot','Buyuk geografik kashfiyotlar'],a:0},
 {q:'1914-yilda Sarayevoda Avstriya taxt vorisi Frans Ferdinandning o\'ldirilishi qaysi urushning boshlanishiga sabab bo\'ldi?',o:['Birinchi jahon urushi','Ikkinchi jahon urushi','Yuz yillik urush','Sovuq urush'],a:0},
 {q:'Yevropaning ko\'p qismini zabt etib, 1812-yilda Rossiyaga yurish qilgan va mag\'lub bo\'lgan fransuz imperatori kim?',o:['Napoleon Bonapart','Lyudovik XIV','Karl Buyuk','Yuliy Sezar'],a:0},
 {q:'Makedoniyalik Aleksandrga qarshi Sug\'diyonada uzoq vaqt kurashgan sarkarda kim?',o:['Spitamen','Doro III','Kir','Hannibal'],a:0},
 {q:'Mo\'g\'ul imperiyasiga asos solgan sarkarda kim?',o:['Chingizxon','Botuxon','Attila','Qubilayxon'],a:0},
 {q:'1402-yilda Anqara jangida Amir Temur qaysi Usmoniy sultonni mag\'lub etdi?',o:['Boyazid I','Mehmed II','Sulaymon Qonuniy','Saladin'],a:0},
 {q:'1453-yilda Usmonlilar qaysi shaharni egalladi va Vizantiya imperiyasi tugadi?',o:['Konstantinopol','Rim','Afina','Damashq'],a:0},
 {q:'Buyuk geografik kashfiyotlar davrida Vasko da Gama qaysi yo\'lni ochdi?',o:['Afrikani aylanib Hindistonga dengiz yo\'li','Amerikaga yo\'l','Shimoliy qutbga yo\'l','Avstraliyaga yo\'l'],a:0},
 {q:'Magellan ekspeditsiyasi (1519–1522) tarixda birinchi bo\'lib nimani amalga oshirdi?',o:['Yer bo\'ylab dengizda suzib chiqdi','Antarktidaga yetib bordi','Everestga chiqdi','Hind okeanini kashf etdi'],a:0},
 {q:'Dunyodagi eng qadimgi yozuvlardan biri bo\'lgan mixxat yozuvini qaysi xalq yaratgan?',o:['Shumerlar','Rimliklar','Vikinglar','Inklar'],a:0},
 {q:'Qadimgi Rimda hokimiyat senat va saylanadigan konsullar qo\'lida bo\'lgan davlat tuzumi nima deyilgan?',o:['Respublika','Monarxiya','Teokratiya','Feodalizm'],a:0},
 {q:'O\'rta asr Yevropasida yer egasi (senyor) va unga qaram dehqonlarga asoslangan tuzum nima deyiladi?',o:['Feodalizm','Kapitalizm','Sotsializm','Quldorlik'],a:0},
 {q:'1957-yilda dunyodagi birinchi sun\'iy yo\'ldosh ("Sputnik") qaysi davlat tomonidan uchirilgan?',o:['SSSR','AQSh','Xitoy','Buyuk Britaniya'],a:0},
 {q:'Inson birinchi marta Oyga qaysi yilda qadam qo\'ydi?',o:['1969','1957','1981','1975'],a:0},
 {q:'Qaysi buyuk davlat 1991-yilda parchalanib, 15 ta mustaqil davlat paydo bo\'ldi?',o:['SSSR','AQSh','Xitoy','Hindiston'],a:0},
 {q:'Ikkinchi jahon urushidan keyingi "Sovuq urush" asosan qaysi ikki davlat o\'rtasida bo\'lgan?',o:['AQSh va SSSR','Xitoy va Yaponiya','Fransiya va Germaniya','Hindiston va Pokiston'],a:0},
 {q:'Germaniyani ikkiga bo\'lib turgan Berlin devori qaysi yilda quladi?',o:['1989','1961','1945','1991'],a:0},
 {q:'Birlashgan Millatlar Tashkiloti (BMT) qaysi urushdan keyin, 1945-yilda tuzilgan?',o:['Ikkinchi jahon urushi','Birinchi jahon urushi','Yuz yillik urush','Sovuq urush'],a:0},
 {q:'8–11-asrlarda dengiz orqali Yevropa qirg\'oqlariga yurishlar qilgan vikinglar qaysi hududdan chiqqan?',o:['Skandinaviya','Arabiston','Markaziy Osiyo','Janubiy Amerika'],a:0},
 {q:'O\'rta asrlardagi Salib yurishlari asosan qaysi shaharni egallash uchun uyushtirilgan?',o:['Quddus','Parij','Moskva','Samarqand'],a:0},
 {q:'Hindiston qaysi yilda Buyuk Britaniyadan mustaqillikka erishdi?',o:['1947','1857','1919','1991'],a:0},
 {q:'Mahatma Gandi Hindiston mustaqilligi uchun qanday kurash yo\'lini tanladi?',o:['Zo\'ravonliksiz qarshilik','Qurolli qo\'zg\'olon','Dengiz janglari','Davlat to\'ntarishi'],a:0},
 {q:'1917-yilda Rossiyada bolsheviklar hokimiyatni qo\'lga olgan voqea nima deb ataladi?',o:['Oktyabr inqilobi','Fransuz inqilobi','Sanoat inqilobi','Gul inqilobi'],a:0},
 {q:'AQShning Mustaqillik deklaratsiyasi qaysi yilda qabul qilingan?',o:['1776','1492','1865','1914'],a:0},
 {q:'AQShda qullikni bekor qilish uchun kurashgan va fuqarolar urushi davrida davlatni boshqargan 16-prezident kim?',o:['Avraam Linkoln','Jorj Vashington','Franklin Ruzvelt','Jon Kennedi'],a:0},
 {q:'Qadimgi Xitoyda ko\'chmanchilardan himoyalanish uchun qurilgan, ming kilometrlarga cho\'zilgan inshoot nima?',o:['Buyuk Xitoy devori','Taj-Mahal','Kreml','Alkazar'],a:0},
 {q:'Qadimgi Yunonistonda har to\'rt yilda o\'tkazilgan sport musobaqalari qaysi joyda bo\'lgan?',o:['Olimpiya','Troya','Sparta','Bobil'],a:0},
 {q:'14-asrda Yevropada "Qora o\'lim" nomi bilan millionlab odamni qirgan kasallik qaysi?',o:['Chuma (o\'lat)','Sil','Chechak','Gripp'],a:0}
];
var qi=0,answered=false,order=[],tq=0,ps=[0,0],seen=[],done=false;
function initQ(){
  var fresh=Q.filter(function(x){return seen.indexOf(x)<0});
  if(fresh.length<10){seen=[];fresh=Q.slice()}
  var pick10=shuffle(fresh).slice(0,10);
  seen=seen.concat(pick10);
  order=pick10.map(function(x){var c=shuffle(x.o.slice());return {q:x.q,o:c,a:c.indexOf(x.o[x.a])}});
  qi=0;tq=0;ps=[0,0];done=false;teams(2,ps,0);renderQ();
}
function renderQ(){
  answered=false;var x=order[qi];
  g('qn').textContent='Savol '+(qi+1)+'/'+order.length;
  g('qt').textContent=x.q;g('m2').textContent='';
  var box=g('opts');box.innerHTML='';
  x.o.forEach(function(t,i){
    var b=document.createElement('button');b.className='opt';b.textContent=t;
    b.onclick=function(){pick(i,b)};box.appendChild(b);
  });
  g('nx').textContent=qi===order.length-1?'Yakunlash':'Keyingisi';
}
function pick(i,b){
  if(answered)return;answered=true;var x=order[qi];
  var all=g('opts').children;
  if(i===x.a){b.classList.add('ok');ps[tq]++;teams(2,ps,tq);g('m2').textContent="✅ To'g'ri!"+(players===2?" Yana shu jamoa javob beradi":"")}
  else{b.classList.add('no');all[x.a].classList.add('ok');tq=players===2?1-tq:0;teams(2,ps,tq);g('m2').textContent="❌ Noto'g'ri. To'g'ri javob: "+x.o[x.a]}
}
function nextQ(){
  if(done){initQ();return}
  if(!answered){g('m2').textContent='Avval javobni tanlang';return}
  if(qi<order.length-1){qi++;renderQ()}
  else{
    done=true;teams(2,ps,-1);
    g('qn').textContent="O'yin tugadi";g('qt').textContent='Natija: '+ps[0]+' : '+ps[1];
    g('opts').innerHTML='';g('m2').textContent=winTxt(ps);
    g('nx').textContent='Yangi savollar bilan boshlash';
  }
}

/* ---------- INGLIZCHA SO'Z TOPISH ---------- */
var WP=['SCHOOL','TEACHER','STUDENT','BOOK','PENCIL','DESK','LESSON','HOMEWORK','FRIEND','FAMILY','MOTHER','FATHER','SISTER','BROTHER','HOUSE','GARDEN','WINDOW','TABLE','CHAIR','WATER','APPLE','ORANGE','BREAD','MILK','SUMMER','WINTER','SPRING','AUTUMN','MOON','STAR','RIVER','MOUNTAIN','FOREST','ANIMAL','HORSE','TIGER','RABBIT','COMPUTER','INTERNET','PHONE','SCIENCE','HISTORY','MUSIC','FOOTBALL','DOCTOR','COUNTRY','FUTURE','ENERGY'];
var DIRS=[[0,1],[1,0],[1,1],[-1,1]],N=10;
var started=false,pos={},T=30,left=30,tmr=null,fails=0,wseen=[],words=[],grid=[],found={},sel=null,wt=0,wsc=[0,0],wdone=false,cellEls=[];
function genGrid(){
  var gr,ok;
  for(var tries=0;tries<100;tries++){
    gr=[];pos={};for(var i=0;i<N;i++){gr.push(new Array(N).fill(''))}
    ok=true;
    for(var k=0;k<words.length&&ok;k++){
      var w=words[k],placed=false;
      for(var a=0;a<300&&!placed;a++){
        var d=DIRS[Math.floor(Math.random()*DIRS.length)],r=Math.floor(Math.random()*N),c=Math.floor(Math.random()*N);
        var er=r+d[0]*(w.length-1),ec=c+d[1]*(w.length-1);
        if(er<0||er>=N||ec<0||ec>=N)continue;
        var fit=true;
        for(var j=0;j<w.length;j++){var ch=gr[r+d[0]*j][c+d[1]*j];if(ch!==''&&ch!==w[j]){fit=false;break}}
        if(!fit)continue;
        for(var j=0;j<w.length;j++)gr[r+d[0]*j][c+d[1]*j]=w[j];
        pos[w]=[r,c,d[0],d[1]];placed=true;
      }
      if(!placed)ok=false;
    }
    if(ok)break;
  }
  var L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(gr[r][c]==='')gr[r][c]=L[Math.floor(Math.random()*26)];
  return gr;
}
function initWS(){
  var fresh=WP.filter(function(x){return wseen.indexOf(x)<0});
  if(fresh.length<8){wseen=[];fresh=WP.slice()}
  words=shuffle(fresh).slice(0,8);wseen=wseen.concat(words);
  grid=genGrid();found={};sel=null;wt=0;wsc=[0,0];wdone=false;cellEls=[];
  teams(3,wsc,0);fails=0;
  g('m3').textContent='';
  g('chips').innerHTML=words.map(function(w){return "<span class='chip' id='chip_"+w+"'>"+w+"</span>"}).join('');
  var box=g('ws');box.innerHTML='';
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    var b=document.createElement('button');b.className='w';b.textContent=grid[r][c];
    b.dataset.r=r;b.dataset.c=c;
    b.onclick=(function(bb){return function(){wclick(bb)}})(b);
    box.appendChild(b);cellEls.push(b);
  }
  started=false;g('ts15').disabled=false;g('ts30').disabled=false;stopTimer();left=T;fmtT();
  g('wsready').classList.remove('hide');g('wsplay').classList.add('hide');g('endb').classList.add('hide');
}
function startWS(){
  started=true;g('ts15').disabled=true;g('ts30').disabled=true;
  g('wsready').classList.add('hide');g('wsplay').classList.remove('hide');g('endb').classList.remove('hide');
  g('m3').textContent="Birinchi harfni, so'ng oxirgi harfni bosing";
  resetTimer();
}
function clearSel(){cellEls.forEach(function(e){e.classList.remove('sel')});sel=null}
function wclick(b){
  if(wdone)return;
  var r=+b.dataset.r,c=+b.dataset.c;
  if(!sel){sel=[r,c];b.classList.add('sel');return}
  if(sel[0]===r&&sel[1]===c){clearSel();return}
  var dr=r-sel[0],dc=c-sel[1],word='',list=[];
  var okLine=(dr===0||dc===0||Math.abs(dr)===Math.abs(dc));
  if(okLine){
    var len=Math.max(Math.abs(dr),Math.abs(dc)),sr=Math.sign(dr),sc=Math.sign(dc);
    for(var i=0;i<=len;i++){var rr=sel[0]+sr*i,cc=sel[1]+sc*i;list.push([rr,cc]);word+=grid[rr][cc]}
  }
  var rev=word.split('').reverse().join('');
  var hit=null;
  if(okLine)words.forEach(function(w){if(!found[w]&&(w===word||w===rev))hit=w});
  var s0=cellEls[sel[0]*N+sel[1]];clearSel();
  var cls='fg';
  if(hit){
    found[hit]=1;wsc[wt]++;fails=0;
    list.forEach(function(p){var e=cellEls[p[0]*N+p[1]];e.classList.remove('fb','fr');e.classList.add(cls)});
    g('chip_'+hit).classList.add(cls);
    if(Object.keys(found).length===words.length){endWS();return}
    g('m3').textContent='✅ '+hit+'!'+(players===2?' Yana shu jamoa davom etadi':'');
    teams(3,wsc,wt);resetTimer();
  }else{
    var fl=okLine?list.map(function(q){return cellEls[q[0]*N+q[1]]}):[s0,b];
    fl.forEach(function(e){e.classList.add('bad')});
    setTimeout(function(){fl.forEach(function(e){e.classList.remove('bad')})},700);
    passTurn("❌ Topilmadi.");
  }
}
function tn(t){return t===0?"Ko'k":"Qizil"}
function endWS(){wdone=true;stopTimer();g('tm').textContent='';g('tm').classList.remove('low');teams(3,wsc,-1);g('m3').textContent=winTxt(wsc)}
function passTurn(pre){
  if(wdone)return;
  if(players===1){g('m3').textContent=pre+" Yana urinib ko'ring";teams(3,wsc,0);resetTimer();return}
  fails++;wt=1-wt;
  if(fails>=2){fails=0;g('m3').textContent="😅 Ikkala jamoa ham topa olmadi! Navbat "+tn(wt)+" jamoada"}
  else g('m3').textContent=pre+" Navbat "+tn(wt)+" jamoaga o'tdi";
  teams(3,wsc,wt);resetTimer();
}
function fmtT(){var t=g('tm');t.textContent='⏱ '+left+' s';t.classList.toggle('low',left<=5)}
function stopTimer(){if(tmr){clearInterval(tmr);tmr=null}}
function runTimer(){
  stopTimer();fmtT();
  if(cur!==3||wdone||!started)return;
  tmr=setInterval(function(){
    left--;fmtT();
    if(left<=0){stopTimer();if(sel)clearSel();passTurn("⏰ Vaqt tugadi!")}
  },1000);
}
function resetTimer(){left=T;runTimer()}
function resumeTimer(){if(started&&!wdone&&!tmr)runTimer()}
function setT(sec){if(started)return;T=sec;g('ts15').classList.toggle('on',sec===15);g('ts30').classList.toggle('on',sec===30);if(started&&!wdone)resetTimer();else{left=T;fmtT()}}

initMem();initQ();initWS();
</script>
